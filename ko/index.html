<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07152f">
  <title>Sleeping Stars v2</title>
  <meta name="description" content="Sleeping Stars v2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500&amp;family=Noto+Serif+JP:wght@400;500&amp;family=Zen+Kaku+Gothic+New:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root{--night:#06142e;--deep:#030918;--ink:#f5f4ee;--mist:#bdc9dc;--gold:#efd99a;--blue:#94bfff;--glass:rgba(10,28,61,.72);--line:rgba(205,220,255,.22)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--deep);scroll-behavior:smooth}body{margin:0;min-height:100%;color:var(--ink);font-family:"Zen Kaku Gothic New","Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 8%,#183b6b 0,transparent 34%),linear-gradient(180deg,var(--night),var(--deep));overflow-x:hidden}button,a{font:inherit}.sky{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.3px),radial-gradient(circle,#8dbbff 0 1px,transparent 1.2px);background-size:91px 91px,137px 137px;background-position:12px 18px,40px 60px;opacity:.36}.aurora{position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 28% 30%,rgba(83,139,215,.18),transparent 40%),radial-gradient(ellipse at 76% 64%,rgba(83,91,168,.14),transparent 38%);filter:blur(40px)}
    .sky-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.72;transition:opacity .6s ease}.decor-constellations{width:100%;height:100%;overflow:visible}.decor-motif{color:var(--decor-color);filter:drop-shadow(0 0 6px var(--decor-color));opacity:.55}.decor-motif polyline{fill:none;stroke:currentColor;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;opacity:.48}.decor-motif circle{fill:currentColor}.meteor-field{position:absolute;inset:0;overflow:hidden}.meteor{position:absolute;top:var(--top);left:var(--left);width:118px;height:1px;border-radius:100%;opacity:0;background:linear-gradient(90deg,transparent,rgba(215,235,255,.18) 38%,rgba(255,245,210,.9));filter:drop-shadow(0 0 5px rgba(190,220,255,.55));transform:rotate(-24deg) translate3d(0,0,0);animation:quiet-meteor var(--duration) linear var(--delay) infinite}.meteor:after{content:"";position:absolute;right:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:#fff6d5;box-shadow:0 0 9px #fff,0 0 18px rgba(145,197,255,.7)}body[data-screen="quiz"] .sky-decor{opacity:.38}body[data-screen="result"] .sky-decor{opacity:.5}@keyframes quiet-meteor{0%,74%{opacity:0;transform:rotate(-24deg) translate3d(0,0,0)}75%{opacity:0}76%{opacity:.85}81%{opacity:0;transform:rotate(-24deg) translate3d(-330px,0,0)}100%{opacity:0;transform:rotate(-24deg) translate3d(-330px,0,0)}}
    main{position:relative;z-index:1;width:min(100%,760px);margin:auto;padding:28px 20px max(34px,env(safe-area-inset-bottom))}.screen{display:none;min-height:calc(100dvh - 62px);align-items:center;justify-content:center;flex-direction:column}.screen.active{display:flex;animation:arrive .7s ease both}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.brand{font-family:"Cormorant Garamond",serif;letter-spacing:.32em;color:var(--gold);font-size:.88rem;text-transform:uppercase}.intro-card{width:100%;padding:clamp(30px,7vw,58px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(20,47,87,.82),rgba(5,14,37,.72));box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center;backdrop-filter:blur(14px)}
    .moon{width:76px;height:76px;margin:18px auto 26px;border-radius:50%;background:#f8edc8;box-shadow:0 0 24px rgba(255,235,174,.6),0 0 80px rgba(139,184,255,.26);position:relative}.moon:after{content:"";position:absolute;width:66px;height:66px;left:18px;top:-7px;border-radius:50%;background:#17365f}.intro-art{display:block;width:min(340px,82%);height:auto;margin:4px auto -2px;filter:drop-shadow(0 15px 26px rgba(0,0,0,.28))}h1,h2,h3{font-family:"Noto Serif JP","Noto Sans KR",serif;font-weight:500}h1{font-size:clamp(2rem,8vw,3.5rem);letter-spacing:.08em;margin:.25em 0}.subhead{font-family:"Cormorant Garamond",serif;color:var(--gold);letter-spacing:.2em;font-size:1rem}.lead{font-family:"Noto Serif JP","Noto Sans KR",serif;font-size:clamp(1rem,3.6vw,1.15rem);line-height:2;margin:26px auto 12px;max-width:31em}.detail{color:var(--mist);line-height:1.9;font-size:.95rem;max-width:38em;margin:0 auto 26px}.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}.meta span{border:1px solid var(--line);border-radius:99px;padding:7px 13px;color:#d8e3f2;font-size:.82rem}.lang-switch{display:flex;justify-content:center;gap:12px;margin-top:16px}.lang-switch a{color:#b9c8dc;font-size:.84rem;text-underline-offset:4px}.lang-switch a[aria-current="page"]{color:var(--gold);text-decoration:none}
    .primary,.secondary{border:0;border-radius:999px;cursor:pointer;min-height:52px;padding:14px 30px;transition:.25s}.primary{color:#172038;background:linear-gradient(135deg,#fff4ce,#ddc477);box-shadow:0 7px 30px rgba(235,211,142,.2);font-family:"Noto Serif JP","Noto Sans KR",serif;font-weight:500;letter-spacing:.05em}.primary:hover{transform:translateY(-2px);box-shadow:0 10px 38px rgba(235,211,142,.32)}.secondary{color:var(--mist);background:transparent;border:1px solid var(--line)}.notice{margin-top:18px;color:#9fadc3;font-size:.78rem;line-height:1.7}.quiz{justify-content:flex-start;padding-top:18px}.quiz-head{position:sticky;top:0;z-index:4;width:100%;padding:15px 0 22px;text-align:center;background:linear-gradient(var(--night) 76%,transparent)}.step{color:var(--gold);font-family:"Cormorant Garamond",serif;letter-spacing:.22em}.progress{width:100%;height:3px;margin:13px 0 18px;background:rgba(255,255,255,.1);overflow:hidden;border-radius:4px}.progress i{display:block;height:100%;width:12.5%;background:linear-gradient(90deg,#8bbdff,#f4dda2);transition:width .4s}.quiz h2{font-size:clamp(1.25rem,5vw,1.7rem);margin:0 0 8px}.hint{font-size:.9rem;color:var(--mist);line-height:1.75;margin:0 auto;max-width:42em}.counter{color:var(--gold);font-size:.86rem;margin-top:10px}.star-words{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 112px}.word{position:relative;min-height:72px;padding:12px;border:1px solid var(--line);border-radius:18px;color:#eef3fb;background:rgba(13,31,65,.58);cursor:pointer;line-height:1.5;transition:.25s;touch-action:manipulation}.word:hover{border-color:rgba(239,217,154,.55)}.word[aria-pressed="true"]{color:#fff9df;border-color:var(--gold);background:rgba(63,72,98,.7);box-shadow:0 0 18px rgba(239,217,154,.18),inset 0 0 18px rgba(239,217,154,.08)}.word[aria-pressed="true"]:before{content:"✦";display:block;color:var(--gold);font-size:.8rem;margin-bottom:3px}.quiz-actions{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:18px max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;background:linear-gradient(transparent,rgba(3,9,24,.96) 34%)}.quiz-actions .secondary{padding-inline:20px}.quiz-actions .primary{min-width:180px}.primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .tie{text-align:center}.tie h2{font-size:clamp(1.8rem,7vw,3rem);margin:14px 0}.tie p{color:var(--mist);line-height:1.9;max-width:34em}.tie-choices{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}.tie-word{min-height:86px}.result{justify-content:flex-start;text-align:center;padding-top:24px}.result h2{font-size:clamp(2rem,9vw,3.5rem);margin:10px 0 2px}.result-sub{color:var(--gold);margin:0 0 22px}.constellation{width:min(345px,84vw);aspect-ratio:345/350;margin:4px auto 16px;position:relative;border:1px solid rgba(216,227,255,.17);border-radius:50%;background:radial-gradient(circle,rgba(105,151,218,.2),transparent 67%)}.constellation svg{width:100%;height:100%;overflow:visible}.official-line{fill:none;stroke:#aabbd2;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.31}.official-fade{fill:none;stroke:url(#officialFade);stroke-width:1;stroke-linecap:round}.star-a{fill:#fff0a8;filter:drop-shadow(0 0 5px #fff0a8)}.star-b{fill:#f6e7b2;opacity:.9;filter:drop-shadow(0 0 3px #f6e7b2)}.star-c{fill:#dce9f2;opacity:.62;filter:drop-shadow(0 0 2px #dce9f2)}.star-d{fill:#c8daed;opacity:.42}
    .panel{width:100%;border:1px solid var(--line);border-radius:22px;background:var(--glass);padding:24px;margin:13px 0;text-align:left;backdrop-filter:blur(10px)}.panel h3{font-size:1.08rem;color:var(--gold);margin:0 0 12px}.panel p{color:#d2dbea;line-height:1.9;margin:0;font-size:1rem}.picked{display:flex;flex-wrap:wrap;gap:8px}.picked span{padding:7px 12px;border:1px solid rgba(239,217,154,.3);border-radius:99px;color:#f5ebc8;font-size:.88rem}.insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.insights .panel{margin:0}.family-reveal{margin-top:32px;padding-top:34px;border-top:1px solid var(--line);width:100%}.family-lead{font-family:"Noto Serif JP","Noto Sans KR",serif;font-size:1.15rem;line-height:2;color:#f3e8c5}.family-card{padding:28px;border:1px solid rgba(239,217,154,.3);border-radius:26px;background:linear-gradient(145deg,rgba(26,54,92,.76),rgba(10,19,43,.76))}.family-images{display:flex;align-items:flex-end;justify-content:center;gap:clamp(2px,2vw,18px);min-height:270px;margin:0 auto 16px}.family-images img{display:block;width:min(46%,270px);height:270px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 24px rgba(0,0,0,.3))}.family-images .kid{height:220px}.family-name{font-family:"Noto Serif JP","Noto Sans KR",serif;font-size:1.55rem;color:var(--gold);margin:0}.family-type{color:var(--mist);margin-top:7px}.save-area{width:100%;margin-top:28px;padding:24px;border:1px solid var(--line);border-radius:22px;background:rgba(7,19,43,.68);text-align:center}.save-area h3{margin:0 0 8px;color:var(--gold)}.save-area p{margin:0 0 18px;color:var(--mist);line-height:1.8}.save-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.save-actions button{margin:0}.cta{margin-top:28px;text-align:center}.cta p{color:var(--mist);line-height:1.9}.cta a{display:inline-flex;text-decoration:none;align-items:center;justify-content:center}.story-link{width:100%;margin-top:25px;padding-top:23px;border-top:1px solid rgba(1     @media(max-width:600px){main{padding:16px 14px 28px}.screen{min-height:calc(100dvh - 44px)}.intro-card{padding:28px 19px;border-radius:22px}.lead{font-size:1rem}.detail{font-size:.92rem}.intro-art{width:min(290px,90%)}.star-words{grid-template-columns:1fr 1fr;gap:10px}.word{min-height:64px;font-size:.91rem}.tie-choices{grid-template-columns:1fr}.insights{grid-template-columns:1fr}.panel{padding:20px}.family-card{padding:20px 12px}.family-images{min-height:205px}.family-images img{height:205px;width:49%}.family-images .kid{height:170px}.quiz-actions .primary{min-width:0;flex:1;max-width:260px}.sky-decor{opacity:.58}.decor-motif{opacity:.4}.meteor{width:88px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.meteor{display:none}}
  </style>
</head>
<body>
  <div class="sky"></div><div class="aurora"></div><div class="sky-decor" id="skyDecor" aria-hidden="true"></div>
  <main>
    <section id="intro" class="screen active"><div class="intro-card"><div class="brand">Rainy Muse</div><div class="moon"></div><div class="subhead" id="subhead"></div><h1>Sleeping Stars</h1><p class="lead" id="lead"></p><p class="detail" id="detail"></p><img class="intro-art" id="introArt" src="../img/intro-lune-pico.png" alt=""><div class="meta" id="meta"></div><button class="primary" id="start"></button><nav class="lang-switch" aria-label="Language"><a data-lang="ja" href="../">日本語</a><a data-lang="en" href="../en/">English</a><a data-lang="ko" href="../ko/">한국어</a></nav><p class="notice" id="notice"></p></div></section>
    <section id="quiz" class="screen quiz"><header class="quiz-head"><div class="step" id="step"></div><div class="progress"><i id="bar"></i></div><h2 id="fieldTitle"></h2><p class="hint" id="choiceGuide"></p><div class="counter"><span id="counterLabel"></span><strong id="count">0</strong></div></header><div class="star-words" id="words"></div><div class="quiz-actions"><button class="secondary" id="back"></button><button class="primary" id="next"></button></div></section>
    <section id="tie" class="screen tie"><div class="brand" id="tieBrand"></div><h2 id="tieTitle"></h2><p id="tieLead"></p><div class="tie-choices" id="tieChoices"></div></section>
    <section id="result" class="screen result"><div class="brand" id="resultBrand"></div><h2 id="resultType"></h2><p class="result-sub" id="resultName"></p><div class="constellation" id="constellation"></div><div class="panel"><h3 id="pickedTitle"></h3><div class="picked" id="picked"></div></div><div class="insights"><article class="panel"><h3 id="insight0"></h3><p id="attract"></p></article><article class="panel"><h3 id="insight1"></h3><p id="value"></p></article><article class="panel"><h3 id="insight2"></h3><p id="tired"></p></article><article class="panel"><h3 id="insight3"></h3><p id="hintText"></p></article></div><article class="panel"><h3 id="overlapTitle"></h3><p id="blend"></p></article><section class="family-reveal"><p class="family-lead" id="familyLead"></p><div class="family-card"><div class="family-images"><img id="parentImage" alt=""><img id="kidImage" class="kid" alt=""></div><p class="family-name" id="familyName"></p><p class="family-type" id="familyType"></p></div></section><section class="save-area"><h3 id="saveTitle"></h3><p id="saveLead"></p><div class="save-actions"><button class="primary" id="saveWallpaper"></button><button class="secondary" id="saveShare"></button></div></section><div class="cta"><p id="paidLead"></p><a class="primary" id="paidLink" target="_blank" rel="noopener"></a></div><div class="story-link"><p id="storyLead"></p><a id="storyLink" target="_blank" rel="noopener"></a><small id="storySource"></small></div><button class="secondary restart" id="restart"></button></section>
  </main>
  <script src="../js/sky-decor.js"></script><script src="../js/data.js"></script><script src="../js/app.js"></script>
</body>
</html>
