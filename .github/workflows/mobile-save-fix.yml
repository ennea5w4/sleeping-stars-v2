name: Fix mobile image saving

on:
  push:
    paths:
      - '.github/workflows/mobile-save-fix.yml'

permissions:
  contents: write

jobs:
  patch-mobile-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile save behavior
        run: |
          echo '' | base64 -d > /tmp/mobile_patch.py
          python /tmp/mobile_patch.py
      - name: Commit fix
        run: |
          git config user.name "Rainy Muse"
          git config user.email "regulus81.lunatype5@gmail.com"
          git add js/app.js
          git commit -m "Fix image saving on mobile" || exit 0
          git push
